name: Playwright Tests on Live
on:
  schedule:
    - cron: '0 * * * *' # https://crontab.cronhub.io/  
  workflow_dispatch:
  #push:
  #  branches: [ main, master ]
  #pull_request:
  #  branches: [ main, master ]
jobs:
  e2e-test:
    timeout-minutes: 240
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Remove .env file
      run: rm .env
    - name: Run Playwright tests
      run: npx playwright test --workers=1
      env:        
        APP_ENV: live
        # ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_LIVE }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD_LIVE }}
      # https://github.com/rtCamp/action-slack-notify    
    - name: Notify Slack on failure
      if: failure()  
      uses: rtCamp/action-slack-notify@v2
     # env:
     #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
     #     SLACK_USERNAME: 'GitHubAction'
     #     SLACK_ICON_EMOJI: ':bell:'
     #     MSG_MINIMAL: true
     #     SLACK_FOOTER: 'Tests on Live via GitHub Actions'
     #     SLACK_CHANNEL: '#heroku-deployments'  
     #     SLACK_TITLE: 'Playwright Tests on Live FAILED!'
     #     SLACK_MESSAGE: |
     #       URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
     #     SLACK_COLOR: 'danger'  
    - uses: actions/upload-artifact@v4
      if: ${{ success() && !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 10
